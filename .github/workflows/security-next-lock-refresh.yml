name: Security Next lock refresh

on:
  push:
    branches:
      - security/next-16.3.6-20260926

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: security/next-16.3.6-20260926
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Refresh Next.js lock entries
        working-directory: docs
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit refreshed lock
        run: |
          if git diff --quiet -- docs/package-lock.json; then
            echo "No package-lock change produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/package-lock.json
          git commit -m "security: refresh Next.js lockfile"
          git push origin HEAD:security/next-16.3.6-20260926
